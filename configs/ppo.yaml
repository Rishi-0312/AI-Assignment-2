# WakeSteer -- main PPO experiment (3x3 NREL 5-MW farm, FLORIS GCH wake model)
name: ppo
seed: 0
n_workers: 8          # FLORIS worker processes (reduce on machines with fewer cores)
eval_every: 10        # PPO iterations between validation runs
eval_episodes: 128    # validation episodes (fixed weather, seed 777)

farm:
  rows: 3
  cols: 3
  spacing_d: 5.0              # rotor diameters
  turbine: nrel_5MW
  turbulence_intensity: 0.06
  wake_model: gch             # Gauss-Curl-Hybrid (FLORIS default)
  rotor_grid_points: 3

wind:
  direction_persistence: 0.7  # AR(1) coefficient of the per-minute direction change
  direction_innovation: 0.8   # deg
  direction_range: [0.0, 360.0]
  mean_speed_range: [5.0, 12.0]
  speed_reversion: 0.1
  speed_innovation: 0.25      # m/s
  speed_bounds: [3.5, 15.0]
  direction_noise: 2.0        # deg, measurement noise
  speed_noise: 0.2            # m/s, measurement noise

env:
  episode_length: 60          # one hour of 1-minute control steps
  dt: 60.0
  yaw_rate: 0.3               # deg/s
  max_offset: 25.0            # deg
  yaw_cost: 0.005             # reward penalty per degree of nacelle travel
  reward_scale: 100.0
  random_initial_offsets: true

ppo:
  total_steps: 5000000
  n_envs: 256
  n_steps: 30
  learning_rate: 0.0003
  anneal_lr: true
  gamma: 0.95
  gae_lambda: 0.9
  clip_coef: 0.2
  update_epochs: 10
  n_minibatches: 8
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.02
  hidden_sizes: [256, 256]
  log_std_init: -0.7
  direction_harmonics: [2, 3, 4, 8]
